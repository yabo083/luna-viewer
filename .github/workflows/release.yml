name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Build APKs
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --split-per-abi \
            --dart-define=GH_REPO=${{ github.repository }} \
            --build-name=${GITHUB_REF_NAME#v}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true

# 签名：release 默认用仓库内的 debug keystore 之外的方式签名会失败。
# 开源版建议两条路：
# 1) 不签名分发：改成 `flutter build apk --debug`（体积大、性能差，仅内测）；
# 2) 配置签名：把 keystore 转 base64 存到 Secrets（KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），
#    在 build 前解出 android/key.properties 与 .jks（见 docs/release.md）。
